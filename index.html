<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>クリップ集</title>
  <style>
    body { display: flex; font-family: sans-serif; margin: 0; }
    
    /* 左側のリスト部分 */
    #list-container { 
      width: 300px; 
      height: 100vh; 
      overflow-y: auto; 
      border-right: 1px solid #ccc; 
      padding: 10px; 
      box-sizing: border-box;
    }
    .clip-item { 
      padding: 10px; 
      margin-bottom: 5px; 
      background: #f0f0f0; 
      cursor: pointer; 
      border-radius: 4px; 
    }
    .clip-item:hover { background: #e0e0e0; }

    /* 右側のプレイヤー部分 */
    #player-container { 
      flex-grow: 1; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }
    
    /* 備考欄のスタイル */
    #now-playing-remarks {
      white-space: pre-wrap; /* フォームの改行をそのまま表示する */
      background-color: #f9f9f9;
      padding: 10px;
      border-radius: 4px;
      width: 100%;
      max-width: 800px;
      color: #333;
      margin-bottom: 20px;
      display: none; /* 初期状態や備考が空の場合は隠す */
    }

    /* 動画の16:9 枠 */
    #video-wrapper {
      width: 100%;            
      max-width: 800px;       
      aspect-ratio: 16 / 9;   
      background-color: #000; 
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="list-container">
    <h2>投稿リスト</h2>
    <div id="clips">読み込み中...</div>
  </div>

  <div id="player-container">
    <h2 id="now-playing-title">クリップを選択してください</h2>
    <p id="now-playing-info"></p>
    
    <!-- 備考を表示するエリアを追加 -->
    <div id="now-playing-remarks"></div>
    
    <div id="video-wrapper"></div>
  </div>

  <script>
    // 1. GASで発行したウェブアプリのURLをここに貼る
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxULFYIUuTHznFvdwXSQHChJfCAm9dLSGJddGQ_WwkqoPX-X_lSz3dvXgr6vYGMdzeH5Q/exec';
    
    // 2. GitHub Pagesのドメイン名を指定（Twitch埋め込みに必須）
    // 例: 'username.github.io' （ローカルテスト時は 'localhost' を追加など）
    const SITE_DOMAIN = 'ochakirin.github.io'; 

    async function fetchData() {
      try {
        const response = await fetch(GAS_URL);
        const data = await response.json();
        renderList(data);
      } catch (error) {
        document.getElementById('clips').innerText = 'データの取得に失敗しました。';
      }
    }

    function renderList(data) {
      const clipsDiv = document.getElementById('clips');
      clipsDiv.innerHTML = ''; 

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'clip-item';
        div.innerHTML = `<strong>${item['タイトル']}</strong><br>${item['チーム名']} / ${item['走者名']}`;
        
        // onclickイベントに item['備考'] を追加で渡すように変更
        div.onclick = () => playVideo(item['クリップURL'], item['タイトル'], item['走者名'], item['備考']);
        clipsDiv.appendChild(div);
      });
    }

    // 引数に remarks (備考) を追加
    function playVideo(url, title, runner, remarks) {
      document.getElementById('now-playing-title').innerText = title;
      document.getElementById('now-playing-info').innerText = `走者: ${runner}`;
      
      // 備考の表示処理
      const remarksDiv = document.getElementById('now-playing-remarks');
      if (remarks && remarks.trim() !== "") {
        remarksDiv.innerText = remarks;
        remarksDiv.style.display = 'block'; // 備考があれば表示
      } else {
        remarksDiv.style.display = 'none';  // 備考が空なら隠す
      }
      
      const embedUrl = getEmbedUrl(url);
      const wrapper = document.getElementById('video-wrapper');
      
      if (embedUrl) {
        wrapper.innerHTML = `<iframe src="${embedUrl}" allowfullscreen></iframe>`;
      } else {
        wrapper.innerHTML = `<p style="color:white; padding:20px;">対応していないURLです: <a href="${url}" target="_blank" style="color:#66ccff;">${url}</a></p>`;
      }
    }

    function getEmbedUrl(rawUrl) {
      if (rawUrl.includes('twitch.tv')) {
        const twitchMatch = rawUrl.match(/(?:clips\.twitch\.tv\/|clip\/)([^/?]+)/);
        if (twitchMatch) {
          const clipId = twitchMatch[1];
          return `https://clips.twitch.tv/embed?clip=${clipId}&parent=${SITE_DOMAIN}&autoplay=false`;
        }
      }
      
      if (rawUrl.includes('youtube.com') || rawUrl.includes('youtu.be')) {
        const ytMatch = rawUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([^&?]+)/);
        if (ytMatch) {
          const videoId = ytMatch[1];
          return `https://www.youtube.com/embed/${videoId}`;
        }
      }
      return null;
    }

    // 初期化
    fetchData();
  </script>
</body>
</html>
